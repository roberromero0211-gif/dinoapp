<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dino - Videos cortos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    header {
      background: #e62117;
      padding: 20px;
      font-size: 30px;
      font-weight: bold;
    }

    .dinosaurio {
      font-size: 70px;
      margin-top: 25px;
    }

    main {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      font-size: 28px;
    }

    button {
      background: #e62117;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 16px;
      margin: 8px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    input {
      display: block;
      width: 100%;
      margin: 12px 0;
      padding: 12px;
      border: 1px solid #666;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
    }

    label {
      display: block;
      margin-top: 16px;
      text-align: left;
    }

    .tarjeta {
      border: 1px solid #444;
      border-radius: 12px;
      padding: 20px;
      margin: 25px auto;
      max-width: 420px;
    }

    video {
      width: 100%;
      margin-top: 15px;
      border-radius: 8px;
    }

    .mensaje {
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    footer {
      padding: 20px;
      color: #aaa;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <header>T-Rex: 🦖 DINO 😎</header>

  <div class="dinosaurio" aria-hidden="true">🦖😎</div>

  <main>
    <h1>Bienvenidos a Dino</h1>
    <h2>Historias que te mueven</h2>
    <p>Videos cortos: historias, emociones y momentos que nos conectan.</p>

    <section class="tarjeta" aria-labelledby="tituloCuenta">
      <h2 id="tituloCuenta">Tu cuenta de Dino</h2>

      <p id="estadoCuenta" class="mensaje" role="status">
        Conectando…
      </p>

      <form id="formularioCuenta" hidden>
        <label for="correo">Correo electrónico</label>
        <input
          type="email"
          id="correo"
          placeholder="Escribe tu correo"
          autocomplete="email"
          required
        >

        <label for="contrasena">Contraseña</label>
        <input
          type="password"
          id="contrasena"
          placeholder="Escribe tu contraseña"
          autocomplete="current-password"
          required
        >

        <button type="submit" id="botonEntrar" disabled>
          Iniciar sesión
        </button>

        <button type="button" id="botonCrear" disabled>
          Crear cuenta
        </button>
      </form>

      <button type="button" id="botonSalir" hidden>
        Cerrar sesión
      </button>

      <p id="mensajeCuenta" class="mensaje" role="status"></p>
    </section>

    <section class="tarjeta" aria-labelledby="tituloVideo">
      <h2 id="tituloVideo">🎬 Prueba tu video</h2>

      <p>Selecciona un video para previsualizarlo.</p>

      <label for="videoArchivo">Seleccionar video</label>
      <input
        type="file"
        id="videoArchivo"
        accept="video/*"
      >

      <video
        id="reproductor"
        controls
        playsinline
        hidden
      ></video>

      <p id="mensajeVideo" class="mensaje" role="status"></p>

      <p>Esta vista previa no guarda ni publica el video.</p>
    </section>
  </main>

  <footer>Dino © 2026</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const formulario = document.getElementById("formularioCuenta");
    const correo = document.getElementById("correo");
    const contrasena = document.getElementById("contrasena");
    const botonCrear = document.getElementById("botonCrear");
    const botonEntrar = document.getElementById("botonEntrar");
    const botonSalir = document.getElementById("botonSalir");
    const estadoCuenta = document.getElementById("estadoCuenta");
    const mensajeCuenta = document.getElementById("mensajeCuenta");

    let supabaseClient = null;

    function mostrarSesion(session) {
      const conectado = Boolean(session && session.user);

      formulario.hidden = conectado;
      botonSalir.hidden = !conectado;

      estadoCuenta.textContent = conectado
        ? "Sesión iniciada: " + (session.user.email || "Usuario de Dino")
        : "Crea una cuenta o inicia sesión.";
    }

    function cambiarEspera(esperando) {
      botonCrear.disabled = esperando;
      botonEntrar.disabled = esperando;
      botonSalir.disabled = esperando;
    }

    function obtenerDatos(esRegistro) {
      correo.value = correo.value.trim();
      contrasena.setCustomValidity("");

      if (!formulario.reportValidity()) {
        return null;
      }

      if (esRegistro && contrasena.value.length < 6) {
        contrasena.setCustomValidity(
          "La contraseña debe tener al menos 6 caracteres."
        );
        contrasena.reportValidity();
        return null;
      }

      return {
        email: correo.value,
        password: contrasena.value
      };
    }

    contrasena.addEventListener("input", function () {
      contrasena.setCustomValidity("");
    });

    botonCrear.addEventListener("click", async function () {
      if (!supabaseClient) return;

      const datos = obtenerDatos(true);
      if (!datos) return;

      cambiarEspera(true);
      mensajeCuenta.textContent = "Creando cuenta…";

      try {
        const { data, error } = await supabaseClient.auth.signUp(datos);

        if (error) {
          mensajeCuenta.textContent =
            "No se pudo crear la cuenta: " + error.message;
          return;
        }

        contrasena.value = "";

        if (data.session) {
          mostrarSesion(data.session);
          mensajeCuenta.textContent = "¡Bienvenido a Dino!";
        } else {
          mensajeCuenta.textContent =
            "Solicitud enviada. Revisa tu correo para confirmar la cuenta. " +
            "Si ya tenías una cuenta, usa Iniciar sesión.";
        }
      } catch {
        mensajeCuenta.textContent =
          "No se pudo conectar. Revisa tu conexión e intenta otra vez.";
      } finally {
        cambiarEspera(false);
      }
    });

    formulario.addEventListener("submit", async function (evento) {
      evento.preventDefault();

      if (!supabaseClient) return;

      const datos = obtenerDatos(false);
      if (!datos) return;

      cambiarEspera(true);
      mensajeCuenta.textContent = "Iniciando sesión…";

      try {
        const { data, error } =
          await supabaseClient.auth.signInWithPassword(datos);

        if (error) {
          mensajeCuenta.textContent =
            "No se pudo iniciar sesión: " + error.message;
          return;
        }

        contrasena.value = "";
        mostrarSesion(data.session);
        mensajeCuenta.textContent = "¡Iniciaste sesión en Dino!";
      } catch {
        mensajeCuenta.textContent =
          "No se pudo conectar. Revisa tu conexión e intenta otra vez.";
      } finally {
        cambiarEspera(false);
      }
    });

    botonSalir.addEventListener("click", async function () {
      if (!supabaseClient) return;

      cambiarEspera(true);
      mensajeCuenta.textContent = "Cerrando sesión…";

      try {
        const { error } = await supabaseClient.auth.signOut();

        if (error) {
          mensajeCuenta.textContent =
            "No se pudo cerrar la sesión: " + error.message;
          return;
        }

        mostrarSesion(null);
        contrasena.value = "";
        mensajeCuenta.textContent = "Cerraste la sesión.";
      } catch {
        mensajeCuenta.textContent =
          "No se pudo conectar. Intenta otra vez.";
      } finally {
        cambiarEspera(false);
      }
    });

    async function conectarCuenta() {
      try {
        if (!window.supabase) {
          throw new Error("No se pudo cargar Supabase.");
        }

        const SUPABASE_URL =
          "https://vlshhaarprrddzffrbsr.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
          "sb_publishable_A-jWpub5-oPjDXd9Zw-BJg_49AJdC9Q";

        supabaseClient = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY
        );

        supabaseClient.auth.onAuthStateChange(function (evento, session) {
          mostrarSesion(session);
        });

        const { data, error } = await supabaseClient.auth.getSession();

        if (error) throw error;

        mostrarSesion(data.session);
        cambiarEspera(false);
      } catch {
        estadoCuenta.textContent =
          "No se pudo conectar con las cuentas de Dino. Recarga la página.";
        mensajeCuenta.textContent =
          "Si el problema continúa, revisa la dirección y la clave pública de Supabase.";
      }
    }

    const selector = document.getElementById("videoArchivo");
    const reproductor = document.getElementById("reproductor");
    const mensajeVideo = document.getElementById("mensajeVideo");

    let urlVideo = null;

    function limpiarVideo() {
      reproductor.pause();
      reproductor.removeAttribute("src");
      reproductor.load();
      reproductor.hidden = true;

      if (urlVideo) {
        URL.revokeObjectURL(urlVideo);
        urlVideo = null;
      }
    }

    selector.addEventListener("change", function () {
      limpiarVideo();
      mensajeVideo.textContent = "";

      const archivo = selector.files[0];
      if (!archivo) return;

      if (archivo.type && !archivo.type.startsWith("video/")) {
        mensajeVideo.textContent = "Selecciona un archivo de video.";
        selector.value = "";
        return;
      }

      urlVideo = URL.createObjectURL(archivo);
      reproductor.src = urlVideo;
      reproductor.hidden = false;

      mensajeVideo.textContent =
        "Tu video está listo para previsualizarse.";
    });

    reproductor.addEventListener("error", function () {
      if (reproductor.getAttribute("src")) {
        mensajeVideo.textContent =
          "Este video no se puede reproducir en tu navegador. Prueba otro formato.";
      }
    });

    window.addEventListener("beforeunload", function () {
      if (urlVideo) URL.revokeObjectURL(urlVideo);
    });

    conectarCuenta();
  </script>
</body>
</html>
